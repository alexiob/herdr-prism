name: Verify platform release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    name: ${{ matrix.target.platform }}-${{ matrix.target.arch }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        target:
          - {os: ubuntu-24.04, platform: linux, arch: x64, extension: ''}
          - {os: ubuntu-24.04-arm, platform: linux, arch: arm64, extension: ''}
          - {os: macos-15, platform: darwin, arch: arm64, extension: ''}
          - {os: macos-15-intel, platform: darwin, arch: x64, extension: ''}
          - {os: windows-2022, platform: win32, arch: x64, extension: '.exe'}
    env:
      HAT_SOCKET_TESTS: '1'
      HAT_REQUIRE_NATIVE: '1'
      HAT_NATIVE_HELPER: native/sampler/artifacts/${{ matrix.target.platform }}-${{ matrix.target.arch }}/hat-sampler${{ matrix.target.extension }}
      RUSTUP_TOOLCHAIN: '1.90.0'
    defaults:
      run:
        shell: bash
    steps:
      # Official release tags/commit pins checked 2026-10-06; see docs/compatibility.md.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: native/sampler/target
          key: native-${{ matrix.target.platform }}-${{ matrix.target.arch }}-rust1.90-${{ hashFiles('native/sampler/Cargo.lock', 'native/sampler/src/**') }}
      - name: Install locked development dependencies
        run: npm ci
      - name: Verify native runner architecture
        run: node -e "if(process.platform!=='${{ matrix.target.platform }}'||process.arch!=='${{ matrix.target.arch }}')throw Error('Runner architecture mismatch')"
      - name: Install pinned native development toolchain and license documents
        run: rustup toolchain install 1.90.0 --profile minimal --component rust-docs
      - name: Native unit tests
        run: cargo test --locked --offline --manifest-path native/sampler/Cargo.toml
      - name: Build and checksum native artifact
        run: node native/sampler/package.mjs
      - name: Retain native helper and matching license evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.target.platform }}-${{ matrix.target.arch }}-node${{ matrix.node }}
          path: native/sampler/artifacts/${{ matrix.target.platform }}-${{ matrix.target.arch }}/
          if-no-files-found: error
          retention-days: 14
      - name: Typecheck
        run: npm run check
      - name: Strict actual-platform tests
        run: npm test
      - name: Compile dependency-free ESM
        run: npm run build
      - name: Required PTY or ConPTY smoke
        run: node scripts/smoke.mjs
      - name: Stage reviewed platform release
        run: node scripts/release.mjs --output artifacts/release --platform ${{ matrix.target.platform }}-${{ matrix.target.arch }}
      - name: Verify helper signing and system-only distribution dependencies
        id: distribution
        run: node scripts/check-distribution.mjs --root artifacts/release --platform ${{ matrix.target.platform }} --arch ${{ matrix.target.arch }} | tee artifacts/distribution-${{ matrix.target.platform }}-${{ matrix.target.arch }}-node${{ matrix.node }}.json
      - name: Retain actual distribution check evidence
        if: always() && steps.distribution.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-${{ matrix.target.platform }}-${{ matrix.target.arch }}-node${{ matrix.node }}
          path: artifacts/distribution-${{ matrix.target.platform }}-${{ matrix.target.arch }}-node${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Download pinned Herdr for isolated live lifecycle tests
        run: node scripts/herdr-test-bin.mjs
      - name: Actual isolated live Herdr install, restart and complete removal
        run: node scripts/live-herdr-test.mjs --release artifacts/release --proof artifacts/live-herdr-proof
      - name: Actual isolated live interaction and ownership acceptance
        if: matrix.target.platform != 'win32'
        run: node scripts/live-features-test.mjs --release artifacts/release --proof artifacts/live-features-proof
      - name: Pinned ordinary GitHub install and lifecycle on Linux
        if: github.event_name == 'push' && matrix.target.platform == 'linux' && matrix.node == '24'
        run: node scripts/github-herdr-test.mjs --repo "${{ github.repository }}" --ref "${{ github.sha }}" --expected-commit "${{ github.sha }}" --proof artifacts/github-herdr-proof
      - name: Check install without development dependencies
        run: node artifacts/release/scripts/check-install.mjs --root artifacts/release
      - name: Archive preserving executable permissions
        run: tar -czf herdr-prism-${{ matrix.target.platform }}-${{ matrix.target.arch }}-node${{ matrix.node }}.tar.gz -C artifacts release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herdr-prism-${{ matrix.target.platform }}-${{ matrix.target.arch }}-node${{ matrix.node }}
          path: herdr-prism-${{ matrix.target.platform }}-${{ matrix.target.arch }}-node${{ matrix.node }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: live-herdr-${{ matrix.target.platform }}-${{ matrix.target.arch }}-node${{ matrix.node }}
          path: artifacts/live-herdr-proof
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: live-features-${{ matrix.target.platform }}-${{ matrix.target.arch }}-node${{ matrix.node }}
          path: artifacts/live-features-proof
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: github-install-${{ matrix.target.platform }}-${{ matrix.target.arch }}-node${{ matrix.node }}
          path: artifacts/github-herdr-proof
          if-no-files-found: ignore
          retention-days: 14
