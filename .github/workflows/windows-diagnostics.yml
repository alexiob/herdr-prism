name: Diagnose Windows platform behavior
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    name: Windows diagnostics / Node ${{ matrix.node }}
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Build diagnostic source
        run: npm ci && npm run build
      - name: Observe fresh-directory ACL restriction
        if: always()
        run: node scripts/windows-diagnostics/acl.mjs
      - name: Observe owned ConPTY console handle initialization
        if: always()
        run: node scripts/windows-diagnostics/conpty.mjs
      - name: Retain capability-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-diagnostics-node${{ matrix.node }}
          path: artifacts/windows-diagnostics/
          if-no-files-found: error
          retention-days: 14
